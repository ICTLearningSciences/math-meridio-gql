# serverless.yml

service: meridiomath-gql

plugins:
  - serverless-offline-ssm
  - serverless-offline
  - serverless-plugin-typescript
  - serverless-domain-manager
  - serverless-prune-plugin

custom:
  serverless-offline-ssm:
    stages:
      - offline
  domain:
    offline: local.meridiomath.org
    dev: api-dev.meridiomath.org
    qa: api-qa.meridiomath.org
    prod: api.meridiomath.org
  customDomain:
    domainName: ${self:custom.domain.${opt:stage, 'dev'}}
    basePath: "graphql" # api root url becomes: api.mentorpal.org/graphql
    # certificateName: '*.mentorpal.org' didnt work
    # certificateName: 'c6107db7-c2ef-4e85-a21f-bee7d1ac008a' didnt work either
    stage: ${self:provider.stage}
    endpointType: regional
    apiType: rest
    createRoute53Record: true
    securityPolicy: tls_1_2
    autoDomain: false #true if preserveExternalPathMappings is true
    # Using same domain in multiple services. https://github.com/amplify-education/serverless-domain-manager/issues/484#issuecomment-1028713546
    # preserveExternalPathMappings: true

  stages:
    offline:
      MONGO_URI: ${ssm:/mathmeridio/dev/mongo_uri, ''}
      GQL_SECRET: ${ssm:/mathmeridio/dev/gql_secret, ''}
      CORS_ORIGIN: "https://dev.meridiomath.org,https://dev.meridiomath.org/,.dev.meridiomath.org,.dev.meridiomath.org/,https://api-dev.meridiomath.org,https://api-dev.meridiomath.org/,http://local.meridiomath.org,http://local.meridiomath.org/,http://localhost:3000,http://localhost:3000/"
      DOMAIN: "meridiomath.org"
      JWT_SECRET: ${ssm:/mathmeridio/dev/jwt_secret, ''}
      REFRESH_TOKEN_NAME: "refreshTokenDev"

    dev:
      MONGO_URI: ${ssm:/mathmeridio/dev/mongo_uri, ''}
      GQL_SECRET: ${ssm:/mathmeridio/dev/gql_secret, ''}
      CORS_ORIGIN: "https://dev.meridiomath.org,https://dev.meridiomath.org/,.dev.meridiomath.org,.dev.meridiomath.org/,https://api-dev.meridiomath.org,https://api-dev.meridiomath.org/,http://local.meridiomath.org,http://local.meridiomath.org/,http://localhost:3000,http://localhost:3000/,http://localhost:3001,http://localhost:3001/"
      DOMAIN: "meridiomath.org"
      JWT_SECRET: ${ssm:/mathmeridio/dev/jwt_secret, ''}
      REFRESH_TOKEN_NAME: "refreshTokenDev"
      LLM_API_ENDPOINT: "https://api-dev.abewriting.org/docs"

    qa:
      MONGO_URI: ${ssm:/mathmeridio/qa/mongo_uri, ''}
      GQL_SECRET: ${ssm:/mathmeridio/qa/gql_secret, ''}
      CORS_ORIGIN: "https://qa.meridiomath.org,https://qa.meridiomath.org/,.qa.meridiomath.org,.qa.meridiomath.org/,https://api-qa.meridiomath.org,https://api-qa.meridiomath.org/"
      DOMAIN: "meridiomath.org"
      JWT_SECRET: ${ssm:/mathmeridio/qa/jwt_secret, ''}
      REFRESH_TOKEN_NAME: "refreshTokenQa"
      LLM_API_ENDPOINT: "https://api-qa.abewriting.org/docs"
    prod:
      MONGO_URI: ${ssm:/mathmeridio/prod/mongo_uri, ''}
      GQL_SECRET: ${ssm:/mathmeridio/prod/gql_secret, ''}
      CORS_ORIGIN: "https://meridiomath.org,https://meridiomath.org/,.meridiomath.org,.meridiomath.org/,https://api.meridiomath.org,https://api.meridiomath.org/"
      DOMAIN: "meridiomath.org"
      JWT_SECRET: ${ssm:/mathmeridio/prod/jwt_secret, ''}
      REFRESH_TOKEN_NAME: "refreshTokenProd"
      LLM_API_ENDPOINT: "https://api.abewriting.org/docs"
provider:
  name: aws
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  runtime: nodejs16.x
  endpointType: regional
  tracing:
    lambda: true
    apiGateway: true
  apiGateway:
    minimumCompressionSize: 1024
  logs:
    restApi:
      # Enables HTTP access logs (default: true)
      accessLogging: true
      # # Log format to use for access logs
      # format: 'requestId: $context.requestId'
      # Enable execution logging (default: true)
      executionLogging: true
      level: INFO # INFO or ERROR
      # Log full requests/responses for execution logging (default: true)
      fullExecutionData: true
  environment:
    MONGO_URI: ${self:custom.stages.${self:provider.stage}.MONGO_URI}
    GQL_SECRET: ${self:custom.stages.${self:provider.stage}.GQL_SECRET}
    CORS_ORIGIN: ${self:custom.stages.${self:provider.stage}.CORS_ORIGIN}
    DOMAIN: "meridiomath.org"
    WEBACL_ARN: ${ssm:/shared-mathm/api_firewall_arn, ''}
    JWT_SECRET: ${self:custom.stages.${self:provider.stage}.JWT_SECRET}
    REFRESH_TOKEN_NAME: ${self:custom.stages.${self:provider.stage}.REFRESH_TOKEN_NAME}
    LLM_API_ENDPOINT: ${self:custom.stages.${self:provider.stage}.LLM_API_ENDPOINT}

    ABE_SECRET_HEADER_NAME: ${ssm:/abewriting-abe/secret_header_name, ''}
    ABE_SECRET_HEADER_VALUE: ${ssm:/abewriting-abe/secret_header_value, ''}
functions:
  graphql:
    timeout: 30
    handler: src/lambda.handler
    events:
      - http:
          path: /
          method: GET
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origins:
              - "http://localhost:3000"
              - "http://localhost:3000/"
              - "http://localhost:3001"
              - "http://localhost:3001/"
              - "https://meridiomath.org"
              - "https://meridiomath.org/"
              - "https://*.meridiomath.org"
              - "https://*.meridiomath.org/"
              - "http://local.meridiomath.org"
              - "http://local.meridiomath.org/"
            allowCredentials: true
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Amzn-Trace-Id
              - Access-Control-Allow-Origin
